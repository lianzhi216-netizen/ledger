<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141A" media="(prefers-color-scheme: dark)">
<meta name="description" content="個人記帳 App：收支、多帳戶、交通卡、統計">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>記帳本</title>
<style>
:root{
  --bg:#EDF1F4;--surface:#FFFFFF;--surface2:#F3F5F8;--ink:#15202B;--ink2:#566474;--ink3:#8D9AA8;--line:#E2E7EC;--track:#DCE2E8;
  --brand:#1D3A5C;--on-brand:#FFFFFF;--brand-soft:#E3EAF3;
  --inc:#13966A;--inc-soft:#DFF3EA;--exp:#E0464B;--exp-soft:#FCE7E7;--mov:#3B76D0;--mov-soft:#E4EDFA;--card:#C9820F;--card-soft:#FBEFD9;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E141A;--surface:#17202A;--surface2:#202B36;--ink:#E7EDF2;--ink2:#A2B0BE;--ink3:#6C7B8A;--line:#26323E;--track:#26323E;
  --brand:#9CC3F0;--on-brand:#0E141A;--brand-soft:#1E2E40;
  --inc:#3CC48E;--inc-soft:#163428;--exp:#FF6B6B;--exp-soft:#3A1D20;--mov:#77A7F2;--mov-soft:#1B2A40;--card:#F0B04A;--card-soft:#3A2D16;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input{font:inherit;color:var(--ink)}
.num,.amt,.ra,.sum3 b,#expr,.bal{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 20px 8px;max-width:560px;margin:0 auto}
.top h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.03em}
main{padding:0 16px calc(104px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
.tabbar .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--ink3);padding:5px 0 3px;font-weight:600}
.tabbar button.on{color:var(--brand)}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar .fab span{width:54px;height:54px;border-radius:18px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;margin-top:-24px;box-shadow:0 6px 16px rgba(29,58,92,.28)}
.tabbar .fab svg{width:28px;height:28px;stroke-width:2.6}

/* home hero */
.hero{display:flex;flex-direction:column;align-items:center;padding:2px 0 6px}
.hero-top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap;max-width:62%;overflow:hidden}
.pill svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.card-pill{background:var(--card-soft);border-color:transparent;color:var(--ink)}
.card-pill b{color:var(--card);font-weight:800}
.ring{position:relative;width:min(76vw,290px);aspect-ratio:1;display:grid;place-items:center;margin-top:6px;border-radius:50%}
.ring svg,.donut svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;max-width:76%}
.ring-l{font-size:13px;color:var(--ink2);font-weight:600}
.amt{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
.amt.m{font-size:33px}.amt.s{font-size:27px}
.amt.neg{color:var(--exp)}
.ring-s{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:2px}
.ring-s svg{width:12px;height:12px;position:static;transform:none;fill:none;stroke:currentColor;stroke-width:2.4}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-top:4px;align-items:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.dot.inc{background:var(--inc)}.dot.exp{background:var(--exp)}
.muted{color:var(--ink3)}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 20px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--ink2);font-weight:700}
.qi{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:24px;font-weight:800;line-height:1}
.qi.exp{background:var(--exp-soft);color:var(--exp)}.qi.inc{background:var(--inc-soft);color:var(--inc)}
.qi.mov{background:var(--mov-soft);color:var(--mov)}.qi.card{background:var(--card-soft);color:var(--card)}

/* lists */
.day{margin-bottom:14px}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);padding:0 6px 6px;font-weight:700}
.day-h span:last-child{font-weight:600;color:var(--ink3)}
.group{background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--surface2)}
.ico.exp{background:var(--exp-soft)}.ico.inc{background:var(--inc-soft)}.ico.mov{background:var(--mov-soft)}.ico.card{background:var(--card-soft)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rt b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{font-weight:700;font-size:16px;white-space:nowrap}
.ra.inc{color:var(--inc)}.ra.exp{color:var(--exp)}.ra.mov{color:var(--mov)}.ra.neg{color:var(--exp)}
.chev{width:16px;height:16px;flex:none;fill:none;stroke:var(--ink3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.addrow .ico{background:transparent;border:1.5px dashed var(--ink3);color:var(--brand);font-weight:700}
.addrow b{color:var(--brand)}
.empty{text-align:center;color:var(--ink3);padding:36px 20px;font-size:14px;line-height:1.8}
.more{display:block;margin:4px auto 0;color:var(--brand);font-weight:700;padding:10px 20px}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink2);margin:20px 6px 8px;font-weight:800}
.sec:first-child{margin-top:4px}
.sec span{font-weight:600;font-size:12.5px;color:var(--ink3)}
.sec span b{color:var(--ink);font-size:15px}
.hint{font-size:12.5px;color:var(--ink3);padding:8px 6px 0;line-height:1.7}
.danger-t{color:var(--exp)!important}

/* segmented */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
main .seg{background:var(--track)}
.seg button{flex:1;height:34px;border-radius:9px;font-size:14px;color:var(--ink2);font-weight:700;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* stats */
.st-ctrl{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.row2{display:flex;gap:8px;align-items:center}
.row2 .seg{flex:1}
.row2 .pill{max-width:50%}
.pnav{display:flex;align-items:center;justify-content:space-between}
.arrow{width:42px;height:42px;border-radius:13px;background:var(--surface);font-size:22px;font-weight:700;color:var(--ink2)}
.plabel{font-weight:800;font-size:16px;padding:6px 12px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:16px;padding:14px 4px;text-align:center;margin-bottom:12px}
.sum3 div+div{border-left:1px solid var(--line)}
.sum3 small{display:block;font-size:12px;color:var(--ink3);font-weight:600}
.sum3 b{font-size:17px;font-weight:800}
.chart{background:var(--surface);border-radius:16px;padding:12px 8px 8px}
.chart svg{width:100%;height:auto;display:block}
.chart .legend{justify-content:center;margin:2px 0 0}
.donut{position:relative;width:210px;height:210px;margin:6px auto 14px;display:grid;place-items:center}
.donut .c{position:relative;text-align:center}
.donut .c small{display:block;font-size:12.5px;color:var(--ink2);font-weight:600}
.donut .c b{font-size:22px;font-weight:800}
.cat-panel{background:var(--surface);border-radius:16px;padding:14px 4px 4px}
.cat-panel .seg{margin:0 10px}
.bar{height:5px;border-radius:3px;background:var(--surface2);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.pct{font-size:12px;color:var(--ink3);font-weight:600;margin-left:6px}

/* sheets */
.ov{position:fixed;inset:0;background:rgba(8,14,20,.46);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.ov.in{animation:fade .18s ease-out}
.ov.in .sheet{animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{background:rgba(8,14,20,0)}}
@keyframes up{from{transform:translateY(48px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.ov.in,.ov.in .sheet{animation:none}}
.sheet{width:100%;max-width:560px;max-height:94dvh;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px;gap:8px;flex:none}
.sh-head h2{font-size:17px;margin:0;font-weight:800;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt{color:var(--brand);font-weight:700;padding:8px 6px;min-width:52px;text-align:left}
.txt:last-child{text-align:right}
.txt.danger{color:var(--exp)}
.sh-body{overflow:auto;padding:4px 16px 18px;flex:1;min-height:0}
.sh-body .group{background:var(--surface2)}
.sh-body .row+.row{border-color:var(--surface)}

/* add sheet */
.t-exp{--type:var(--exp);--type-soft:var(--exp-soft)}.t-inc{--type:var(--inc);--type-soft:var(--inc-soft)}
.t-mov{--type:var(--mov);--type-soft:var(--mov-soft)}.t-card{--type:var(--card);--type-soft:var(--card-soft)}
.typeseg{margin:0 16px}
.typeseg button.on{color:var(--type)}
.amt-box{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-end;gap:4px;padding:8px 20px 4px;color:var(--type);flex:none}
.amt-box .cur{font-size:20px;font-weight:800}
#expr{font-size:38px;font-weight:800;letter-spacing:-.01em;word-break:break-all;text-align:right;line-height:1.2}
#expr.ph{opacity:.35}
#exprRes{width:100%;text-align:right;font-size:14px;color:var(--ink2);min-height:21px;font-weight:600}
.lbl{font-size:12.5px;color:var(--ink3);margin:12px 2px 6px;font-weight:700}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.cat{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12.5px;color:var(--ink2);font-weight:600;min-width:0}
.cat span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--surface2)}
.cat em{font-style:normal;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat.on{color:var(--ink);font-weight:800}
.cat.on span{background:var(--type-soft);box-shadow:0 0 0 2px var(--type)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:999px;background:var(--surface2);font-size:14px;white-space:nowrap;border:1.5px solid transparent;font-weight:600}
.chip.on{background:var(--type-soft,var(--brand-soft));border-color:var(--type,var(--brand));font-weight:800}
.meta{display:flex;gap:8px;margin-top:14px}
.meta input{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;font-size:14px;min-width:0}
.meta input[type=date]{flex:none;width:150px}
.meta .note{flex:1}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px 10px;background:var(--surface2);border-top:1px solid var(--line);flex:none}
.pad button{height:50px;border-radius:12px;background:var(--surface);font-size:22px;font-weight:700;user-select:none}
.pad button:active{transform:scale(.96)}
.pad .op{background:transparent;color:var(--type);font-size:24px}
.pad .clr{background:transparent;color:var(--ink2);font-size:16px}
.pad .go{grid-column:span 3;background:var(--type);color:#fff;font-size:17px;font-weight:800}
@media (prefers-color-scheme:dark){.pad .go{color:#0E141A}}
@media (max-height:720px){
  .pad{gap:5px;padding:6px 8px 8px}.pad button{height:42px;font-size:20px}
  #expr{font-size:30px}.amt-box{padding:4px 20px 0}
  .cat span{width:38px;height:38px;font-size:18px}.cat{padding:3px 0}
  .lbl{margin:8px 2px 4px}.meta{margin-top:10px}
}
.t-invest{--type:var(--inv);--type-soft:var(--inv-soft)}
.typeseg button{padding:0 2px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.frow.one{grid-template-columns:1fr}
.fld span{display:block;font-size:12.5px;color:var(--ink3);font-weight:700;margin:0 2px 6px}
.fld input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.codename{min-height:20px;font-size:13px;color:var(--ink2);padding:6px 2px 4px}.codename b{color:var(--inv)}
.warn{color:var(--exp)}
.notice{background:var(--card-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}

/* forms */
.field{display:block;margin:14px 0}
.field>span{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:6px;font-weight:700}
.field input{width:100%;height:48px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);padding:0 14px;font-size:16px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:150px;overflow:auto;background:var(--surface2);border-radius:13px;padding:6px}
.emojis button{aspect-ratio:1;border-radius:10px;font-size:22px}
.emojis button.on{background:var(--surface);box-shadow:inset 0 0 0 2px var(--brand)}
.btn{display:block;width:100%;height:50px;border-radius:14px;background:var(--brand);color:var(--on-brand);font-weight:800;font-size:16px;margin-top:10px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--exp-soft);color:var(--exp)}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cardbal{text-align:center;padding:6px 0 4px}
.cardbal small{display:block;color:var(--ink2);font-size:13px;font-weight:600}
.cardbal b{font-size:36px;font-weight:800;color:var(--card)}
.cardbal b.neg{color:var(--exp)}
.btn.top{background:var(--card);color:#fff}
@media (prefers-color-scheme:dark){.btn.top{color:#0E141A}}

/* budgets: flasks around the ring */
:root{--glass:rgba(190,220,245,.55);--glass-lip:#E6F1FB}
@media (prefers-color-scheme:dark){:root{--glass:rgba(150,190,230,.16);--glass-lip:#22303D}}
.hero-mid{position:relative;width:100%;display:flex;justify-content:center;align-items:center}
.hero-mid.has-b{display:grid;grid-template-columns:66px minmax(0,1fr) 66px}
.hero-mid.has-b .ring{width:min(52vw,236px);justify-self:center}
.hero-mid.has-b .amt{font-size:30px}.hero-mid.has-b .amt.m{font-size:25px}.hero-mid.has-b .amt.s{font-size:21px}
.bud-col{display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:10px;min-width:0;align-self:stretch}
.bud{display:flex;flex-direction:column;align-items:center;gap:0;width:66px;padding:2px 0;border-radius:12px}
.bud svg.flask{width:46px;height:69px}
.bud-n{font-size:11.5px;color:var(--ink2);font-weight:700;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.bud-v{font-size:12px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.bud-v.low{color:var(--card)}.bud-v.neg{color:var(--exp)}
.bud-add{width:34px;height:34px;border-radius:50%;border:1.5px dashed var(--ink3);color:var(--ink3);font-size:18px;font-weight:700}
.bud-edge{position:absolute;left:0;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.bud-edge svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bud-edge i{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-style:normal;font-size:12px;font-weight:800;line-height:16px;text-align:center}
svg.flask{overflow:visible}
svg.flask .glass{fill:var(--glass)}
svg.flask .lq{fill:#6F78DD}svg.flask .sf{fill:#9EA6F0}
svg.flask.low .lq{fill:#EF9F27}svg.flask.low .sf{fill:#FAC775}
svg.flask .ol{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round}
svg.flask.over .ol{stroke:var(--exp)}
svg.flask .lip{fill:var(--glass-lip);stroke:var(--ink);stroke-width:3.5}
svg.flask .hl{fill:none;stroke:#fff;stroke-opacity:.75;stroke-linecap:round}
svg.flask .bub{fill:#fff;fill-opacity:.7;animation:rise 2.6s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-34px);opacity:0}}
@media (prefers-reduced-motion:reduce){svg.flask .bub{animation:none}}
.bud-hero{display:flex;align-items:center;gap:16px;padding:4px 4px 14px}
.bud-hero svg.flask{width:72px;height:108px;flex:none}
.bud-hero small{display:block;font-size:13px;color:var(--ink2);font-weight:600}
.bud-hero b{display:block;font-size:28px;font-weight:800;color:var(--ink);line-height:1.25}
.bud-hero b.neg{color:var(--exp)}
.bud-hero span{display:block;font-size:13.5px;color:var(--ink2);margin-top:2px}
.sh-body .sum3{background:var(--surface2)}
.bud.ended{opacity:.55}
svg.flask.ended .lq{fill:#9AA3AD}svg.flask.ended .sf{fill:#C5CBD1}
svg.flask.ended .ol,svg.flask.ended .lip{stroke:var(--ink3)}svg.flask.ended .bub{display:none}
.rv{padding:10px 14px}.rv+.rv{border-top:1px solid var(--surface)}
.rv-h{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.rv-h .neg{color:var(--exp)}.rv small{display:block;font-size:12px;color:var(--ink3);margin-top:3px}
.drow{display:flex;gap:8px;align-items:center}.drow em{font-style:normal;color:var(--ink2);font-size:14px}
.drow select{height:48px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);padding:0 10px;font-size:15px;color:var(--ink)}
.drow input{flex:1;min-width:0;height:48px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);padding:0 10px;font-size:15px}
.sh-body .sum3 div+div{border-color:var(--surface)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.field select{width:100%;height:48px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;font-size:16px;color:var(--ink)}
/* investment */
:root{--inv:#6E56CF;--inv-soft:#ECE8FB}
@media (prefers-color-scheme:dark){:root{--inv:#A894F7;--inv-soft:#2A2448}}
.ico.inv{background:var(--inv-soft)}.ra.inv,.cf-amt.invest{color:var(--inv)}
.up{color:var(--exp)!important}.down{color:var(--inc)!important}

/* account picker checkboxes */
.ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink3);display:grid;place-items:center;flex:none;font-size:14px;font-weight:900;color:var(--on-brand)}

/* switch */

.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--inc)}.sw.on::after{left:23px}
/* confirm dialog */
.ov.center{align-items:center;padding:20px}

.cf h2{font-size:15px;color:var(--ink2);margin:0 0 14px;text-align:center;font-weight:700}

<script>
'use strict';
const APP_VERSION='1.3.1';
const PRICE_API='https://ledger-price.lianzhi216.workers.dev/';
const KEY='ledger.v1';
const $=s=>document.querySelector(s);
const EMOJIS=['🍱','🍜','🍔','☕','🧋','🍎','🍰','🍺','🚌','🚇','🚕','🛵','🚲','⛽','🅿️','✈️','🛍️','👕','👟','💄','🎮','🎬','🎵','🎤','🏐','🏀','🏸','🏋️','🏊','📚','✏️','💻','📱','🎧','🧴','🧻','🏠','💡','💧','📶','💊','🏥','✂️','🎁','💝','🐶','🧾','📦','💰','💼','🎓','🏦','📈','🧧','✨','💵','💳','📮','🐷','🎫','🗂️','⭐'];
const KIND={transfer:{label:'轉帳',icon:'🔁'},withdraw:{label:'提款',icon:'🏧'},deposit:{label:'存款',icon:'📥'}};
const TYPE_LABEL={expense:'支出',income:'收入',transfer:'轉移',card:'交通卡',invest:'投資'};
const TYPE_CLS={expense:'exp',income:'inc',transfer:'mov',card:'card',invest:'invest'};
const PALETTE=['#E0464B','#EE8A2A','#D9AE1E','#13966A','#26A1A6','#3B76D0','#7A5AF0','#C2549D','#8C6D4A','#7F8C99'];
const RIDE_NOTES=['捷運','公車','火車','客運','YouBike','超商'];
const ICON_CHEV='<svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>';
const ICON_DOWN='<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';

/* ---------- utils ---------- */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pad2(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function today(){return ymd(new Date())}
function r2(n){return Math.round(n*100)/100}
function money(n,sign){const v=r2(n);const s=Math.abs(v).toLocaleString('zh-TW',{maximumFractionDigits:2});return(v<0?'-':(sign&&v>0?'+':''))+'$'+s}
function short(n){if(n>=10000){const w=n/10000;return(Number.isInteger(w)?w:w.toFixed(1))+'萬'}return n.toLocaleString('zh-TW')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- data ---------- */
function defaults(){
  return{version:1,
    accounts:[
      {id:'a1',name:'銀行帳戶',icon:'🏦',note:'',initial:0},
      {id:'cash',name:'現金',icon:'💵',note:'身上的錢',initial:0,cash:true}],
    cards:[{id:'c1',name:'悠遊卡',icon:'🚇',initial:0}],
    categories:{
      expense:[{id:'e1',name:'餐飲',icon:'🍱'},{id:'e2',name:'交通',icon:'🚌',sys:'transport'},{id:'e3',name:'購物',icon:'🛍️'},{id:'e4',name:'娛樂',icon:'🎮'},{id:'e5',name:'運動',icon:'🏐'},{id:'e6',name:'學業',icon:'📚'},{id:'e7',name:'生活用品',icon:'🧴'},{id:'e8',name:'醫療',icon:'💊'},{id:'e9',name:'其他',icon:'📦'}],
      income:[{id:'i1',name:'生活費',icon:'💰'},{id:'i2',name:'打工',icon:'💼'},{id:'i3',name:'獎學金',icon:'🎓'},{id:'i4',name:'利息',icon:'🏦'},{id:'i6',name:'股利',icon:'📈'},{id:'i5',name:'其他',icon:'✨'}]},
    tx:[],budgets:[],reminders:[],stocks:{},meta:{last:{},lastCat:{},confirm:true,filter:'all',prices:{}}};
}
function normalize(o){
  const d=defaults();
  const db={version:1,
    accounts:Array.isArray(o.accounts)?o.accounts:d.accounts,
    cards:Array.isArray(o.cards)?o.cards:[],
    categories:{expense:Array.isArray(o.categories?.expense)?o.categories.expense:d.categories.expense,
                income:Array.isArray(o.categories?.income)?o.categories.income:d.categories.income},
    tx:Array.isArray(o.tx)?o.tx:[],
    budgets:Array.isArray(o.budgets)?o.budgets.slice(0,4):[],
    reminders:Array.isArray(o.reminders)?o.reminders:[],
    stocks:(o.stocks&&typeof o.stocks==='object')?o.stocks:{},
    meta:(o.meta&&typeof o.meta==='object')?o.meta:{}};
  db.meta.last=db.meta.last||{};
  db.meta.lastCat=db.meta.lastCat||{};
  db.meta.prices=(db.meta.prices&&typeof db.meta.prices==='object')?db.meta.prices:{};
  db.reminders.forEach(r=>{r.amount=Number(r.amount)||0;if(!['week','month','year'].includes(r.freq))r.freq='month';r.day=Number(r.day)||1;r.month=Number(r.month)||0;r.wday=Number(r.wday)||0;if(!/^\d{4}-\d\d-\d\d$/.test(r.doneUntil||''))r.doneUntil=ymd(new Date(Date.now()-864e5))});
  if(db.meta.confirm===undefined)db.meta.confirm=true;
  if(!Array.isArray(db.meta.filter))db.meta.filter='all';
  db.budgets.forEach(b=>{b.amount=Number(b.amount)||0;b.startDay=Math.min(28,Math.max(1,Number(b.startDay)||1));
    if(!['day','week','month','custom'].includes(b.period))b.period='month';
    if(b.period==='custom'&&!(b.from&&b.to))b.period='month';
    b.weekStart=Math.min(6,Math.max(0,Number(b.weekStart)||0))});
  db.tx.forEach(t=>{t.amount=Number(t.amount)||0;t.note=t.note||'';if(t.shares!==undefined)t.shares=Number(t.shares)||0});
  db.accounts.forEach(a=>{a.initial=Number(a.initial)||0});
  db.cards.forEach(c=>{c.initial=Number(c.initial)||0});
  return db;
}
function load(){try{const s=localStorage.getItem(KEY);if(s)return normalize(JSON.parse(s))}catch(e){}return defaults()}
let db=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('儲存失敗：手機儲存空間不足')}}

const ui={tab:'home',filter:db.meta.filter,stMode:'flow',period:'month',anchor:new Date(),catType:'expense',limit:40,setCat:'expense'};

const acc=id=>db.accounts.find(a=>a.id===id);
const card=id=>db.cards.find(c=>c.id===id);
const accName=id=>{const a=acc(id);return a?esc(a.name):'已刪除帳戶'};

function accDelta(t,id){
  switch(t.type){
    case 'income':return t.accountId===id?t.amount:0;
    case 'expense':case 'topup':return t.accountId===id?-t.amount:0;
    case 'transfer':return(t.toAccountId===id?t.amount:0)-(t.accountId===id?t.amount:0);
    case 'buy':return t.accountId===id?-t.amount:0;
    case 'sell':case 'div':return t.accountId===id?t.amount:0;
  }return 0;
}
const accBalance=a=>r2(db.tx.reduce((s,t)=>s+accDelta(t,a.id),a.initial||0));
const totalBalance=()=>r2(db.accounts.reduce((s,a)=>s+accBalance(a),0));
const cardBalance=c=>r2(db.tx.reduce((s,t)=>s+(t.cardId===c.id?(t.type==='topup'?t.amount:t.type==='ride'?-t.amount:0):0),c.initial||0));
/* [收入, 支出]：轉移不算收支；交通卡儲值算支出；搭車扣款不重複算 */
function flowOf(t,f){
  if(f!=='all'&&!f.includes(t.accountId))return[0,0];
  if(t.type==='income'||t.type==='div')return[t.amount,0];
  if(t.type==='expense'||t.type==='topup')return[0,t.amount];
  return[0,0];
}
function catFor(t){
  if(t.type==='topup'){const c=db.categories.expense.find(c=>c.sys==='transport');return c||{id:'__topup',name:'交通卡儲值',icon:'🚇'}}
  if(t.type==='div')return db.categories.income.find(c=>c.name==='股利')||{id:'__div',name:'股利',icon:'🪙'};
  return(db.categories[t.type]||[]).find(c=>c.id===t.categoryId)||{id:'__none',name:'未分類',icon:'❔'};
}
/* 帳戶篩選：'all' 或帳戶 id 陣列（可複選） */
const isAll=()=>ui.filter==='all';
const selIds=()=>isAll()?db.accounts.map(a=>a.id):ui.filter;
function setFilter(v){
  if(v!=='all'){v=v.filter(id=>acc(id));if(!v.length||v.length>=db.accounts.length)v='all'}
  ui.filter=v;db.meta.filter=v;save();
}
const selBalance=()=>r2(selIds().reduce((s,id)=>{const a=acc(id);return s+(a?accBalance(a):0)},0));
const setDelta=(t,ids)=>ids.reduce((s,id)=>s+accDelta(t,id),0);
function filterLabel(){
  if(isAll())return'總餘額';
  const as=ui.filter.map(acc).filter(Boolean);
  return as.length===1?esc(as[0].icon+' '+as[0].name):esc(as.map(a=>a.name).join(' + '));
}
const cmpTx=(a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0);

/* ---------- 投資：持股、平均成本、損益 ---------- */
const CODE_RE=/^[0-9A-Z]{4,6}$/;
const stockName=c=>db.stocks[c]||db.meta.prices[c]?.name||'';
const stockLabel=c=>esc(c)+(stockName(c)?' '+esc(stockName(c)):'');
/* 依日期順序重算：買進加股數與成本；賣出依平均成本扣掉成本，差額是已實現損益 */
function holdingsMap(excludeId){
  const m={};
  db.tx.filter(t=>['buy','sell','hold','div'].includes(t.type)&&t.id!==excludeId)
    .sort((a,b)=>a.date.localeCompare(b.date)||(a.created||0)-(b.created||0))
    .forEach(t=>{
      const h=m[t.code]||(m[t.code]={code:t.code,shares:0,cost:0,realized:0,invested:0,div:0,txs:[]});
      h.txs.push(t);
      if(t.type==='div'){h.div+=t.amount;return}
      if(t.type==='buy'||t.type==='hold'){h.shares+=t.shares;h.cost+=t.amount;h.invested+=t.amount}
      else{const n=Math.min(t.shares,Math.max(0,h.shares)),cs=h.shares>0?h.cost*n/h.shares:0;
        h.cost-=cs;h.shares-=t.shares;h.realized+=t.amount-cs;if(h.shares<=0){h.shares=Math.max(0,h.shares);h.cost=0}}
    });
  Object.values(m).forEach(h=>{h.cost=r2(h.cost);h.realized=r2(h.realized);h.div=r2(h.div);
    const p=db.meta.prices[h.code];h.price=p?.price||null;h.value=h.price!=null?r2(h.price*h.shares):null;
    h.pl=h.value!=null?r2(h.value-h.cost):null;h.avg=h.shares>0?h.cost/h.shares:0;
    h.total=h.shares>0&&h.pl==null?null:r2((h.pl||0)+h.realized+h.div)});
  return m;
}
function investSummary(){
  const hs=Object.values(holdingsMap()),held=hs.filter(h=>h.shares>0);
  const cost=r2(held.reduce((s,h)=>s+h.cost,0)),realized=r2(hs.reduce((s,h)=>s+h.realized,0));
  const priced=held.every(h=>h.value!=null);
  const value=priced?r2(held.reduce((s,h)=>s+h.value,0)):null;
  const div=r2(hs.reduce((s,h)=>s+h.div,0)),pl=value!=null?r2(value-cost):null;
  return{hs,held,cost,realized,value,pl,div,total:pl!=null||!held.length?r2((pl||0)+realized+div):null};
}
const priceState={loading:false,error:false};
async function fetchPrices(codes,force){
  codes=[...new Set(codes.filter(c=>CODE_RE.test(c)))];if(!codes.length)return false;
  const now=Date.now();
  if(!force&&codes.every(c=>db.meta.prices[c]&&now-db.meta.prices[c].at<60000))return true;
  priceState.loading=true;priceState.error=false;
  try{
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),9000);
    const r=await fetch(PRICE_API+'?codes='+codes.join(','),{signal:ctl.signal});clearTimeout(tm);
    if(!r.ok)throw new Error(r.status);
    const data=await r.json();
    codes.forEach(c=>{const d=data[c];if(d&&d.price){db.meta.prices[c]={price:+d.price,name:d.name||'',time:d.time||'',at:now};if(d.name)db.stocks[c]=d.name}});
    save();priceState.loading=false;
    return codes.some(c=>data[c]);
  }catch(e){priceState.loading=false;priceState.error=true;return false}
  finally{if(sheets.length)rs();if(ui.tab==='accounts')$('#view').innerHTML=VIEWS[ui.tab]()}
}
function priceTimeLabel(codes){
  const ps=codes.map(c=>db.meta.prices[c]).filter(Boolean);
  if(priceState.loading)return'正在更新股價…';
  if(!ps.length)return priceState.error?'無法取得股價，目前只顯示投入成本':'';
  const p=ps.sort((a,b)=>b.at-a.at)[0],m=/(\d{4})-(\d\d)-(\d\d)\s+(\d\d:\d\d)/.exec(p.time||'');
  const t=m?`${+m[2]}/${+m[3]} ${m[4]}`:p.time||new Date(p.at).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  return`股價時間：${t}`+(priceState.error?'（這次更新失敗，顯示上次的股價）':'');
}
const plCls=v=>v>0?'up':v<0?'down':'';
const pct=(a,b)=>b>0?(a/b*100).toFixed(2)+'%':'';

/* ---------- shared pieces ---------- */
function donut(segs,{size=260,r=112,sw=16}={}){
  const c=size/2,C=2*Math.PI*r,tot=segs.reduce((s,x)=>s+x.v,0);
  const n=segs.filter(s=>s.v>0).length,gap=n>1?4:0;let off=0,arcs='';
  if(tot>0)segs.forEach(s=>{if(s.v<=0)return;const len=C*s.v/tot;
    arcs+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${sw}" stroke-dasharray="${Math.max(.6,len-gap).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-(off+gap/2)).toFixed(2)}"/>`;off+=len});

function txRow(t,ctx={}){

function dayLabel(s){

function groupedList(list,ctx){
  let h='',cur=null,buf=[];
  const flush=()=>{if(!cur)return;let net=0;buf.forEach(t=>{if(ctx.card){net+=t.type==='topup'?t.amount:t.type==='ride'?-t.amount:0}else{const[i,e]=flowOf(t,ctx.account||'all');net+=i-e}});

const FLASK='M40 11 V63.27 A40 40 0 1 0 60 63.27 V11 Z';
function flaskSvg(key,f,over,ended){
  const id='fk'+key;
  return`<svg class="flask${ended?' ended':''}" viewBox="0 0 100 150" aria-hidden="true" data-fk="${key}" data-f="${f}" data-over="${over?1:0}">
  <defs><clipPath id="${id}"><path d="${FLASK}"/></clipPath></defs>
  <path d="${FLASK}" class="glass"/>
  <g clip-path="url(#${id})"><rect class="lq" x="0" y="160" width="100" height="160"/><ellipse class="sf" cx="50" cy="160" rx="0" ry="0"/>
  <g class="bbs"><circle class="bub" cx="40" cy="128" r="3.2"/><circle class="bub" cx="58" cy="134" r="2.4" style="animation-delay:.9s"/><circle class="bub" cx="49" cy="122" r="2.8" style="animation-delay:1.7s"/></g></g>
  <path d="M24 92 A28 28 0 0 0 31 124" class="hl" stroke-width="4"/><path d="M45 18 V56" class="hl" stroke-width="3"/>
  <path d="${FLASK}" class="ol"/><rect x="34" y="4" width="32" height="9" rx="4.5" class="lip"/></svg>`;
}
function drawFlask(svg,f,over,w=0){
  const y=142-f*72,r=Math.sqrt(Math.max(0,1600-(y-102)**2));
  svg.classList.toggle('low',f<.2&&!over);svg.classList.toggle('over',over);
  const lq=svg.querySelector('.lq'),sf=svg.querySelector('.sf');
  lq.setAttribute('y',f>0?y.toFixed(2):160);
  sf.setAttribute('cy',y.toFixed(2));sf.setAttribute('rx',f>.01?r.toFixed(2):0);sf.setAttribute('ry',Math.max(0,r*.13+w).toFixed(2));
  svg.querySelector('.bbs').style.display=f>.08?'':'none';
}
const flaskShown={};
function animateFlasks(){
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('svg.flask[data-fk]').forEach(svg=>{
    const key=svg.dataset.fk,to=+svg.dataset.f,over=svg.dataset.over==='1';
    const from=key in flaskShown?flaskShown[key]:to;flaskShown[key]=to;
    if(still||Math.abs(from-to)<.001){drawFlask(svg,to,over);return}
    const t0=performance.now();drawFlask(svg,from,over);
    const step=t=>{const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);
      drawFlask(svg,from+(to-from)*e,over,Math.sin(k*Math.PI*3)*(1-k)*2.5);if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
const PERIOD_LABEL={day:'每天',week:'每週',month:'每月',custom:'自訂日期'};
const REVIEW_MAX={day:7,week:4,month:6},REVIEW_UNIT={day:'天',week:'週',month:'個月'};
const WEEKDAYS=['一','二','三','四','五','六','日'];
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
function budgetPeriod(b,ref=new Date()){
  ref=new Date(ref.getFullYear(),ref.getMonth(),ref.getDate());
  let sd,ed;
  if(b.period==='day'){sd=ref;ed=addDays(ref,1)}
  else if(b.period==='week'){const off=(((ref.getDay()+6)%7)-(b.weekStart||0)+7)%7;sd=addDays(ref,-off);ed=addDays(sd,7)}
  else if(b.period==='custom'){sd=parseD(b.from);ed=addDays(parseD(b.to),1)}
  else{const d=b.startDay||1,y=ref.getFullYear(),m=ref.getMonth();sd=ref.getDate()>=d?new Date(y,m,d):new Date(y,m-1,d);ed=new Date(sd.getFullYear(),sd.getMonth()+1,d)}
  return{s:ymd(sd),e:ymd(ed),sd,ed};
}
function periodLabel(b,p,cur){
  if(b.period==='day')return md(p.sd)+(cur?'（今天）':'');
  if(b.period==='month'&&(b.startDay||1)===1)return`${p.sd.getMonth()+1}月`+(cur?'（本月）':'');
  return`${md(p.sd)} – ${md(addDays(p.ed,-1))}`+(cur&&b.period==='week'?'（本週）':cur&&b.period==='month'?'（本期）':'');
}
function budgetStatus(b){if(b.period!=='custom')return'active';const t=today();return t<b.from?'upcoming':t>b.to?'ended':'active'}
function budgetDesc(b){
  if(b.period==='day')return'每天';
  if(b.period==='week')return`每週${WEEKDAYS[b.weekStart||0]}起算`;
  if(b.period==='custom')return`${md(parseD(b.from))} – ${md(parseD(b.to))}`;
  return`每月 ${b.startDay||1} 日起算`;
}
function budgetState(b,p=budgetPeriod(b)){
  const list=db.tx.filter(t=>(t.type==='expense'||t.type==='topup')&&t.date>=p.s&&t.date<p.e
    &&(!b.accounts||b.accounts.includes(t.accountId))&&(!b.cats||b.cats.includes(catFor(t).id)));
  const spent=r2(list.reduce((s,t)=>s+t.amount,0)),left=r2(b.amount-spent);
  return{p,list,spent,left,over:left<0,status:budgetStatus(b),f:b.amount>0?Math.max(0,Math.min(1,left/b.amount)):0};
}
function budgetScope(b){
  const an=b.accounts?(b.accounts.map(id=>acc(id)?.name).filter(Boolean).join('、')||'沒有帳戶'):'全部帳戶';
  const cn=b.cats?(b.cats.map(id=>db.categories.expense.find(c=>c.id===id)?.name).filter(Boolean).join('、')||'沒有分類'):'全部分類';
  return{an,cn};
}
function budgetBtn(b){
  const st=budgetState(b),ended=st.status==='ended',up=st.status==='upcoming';
  const cls=up?'':st.over?'neg':(st.f<.2&&!ended)?'low':'';
  const v=up?`${md(parseD(b.from))}開始`:st.over?'超支'+money(-st.left):money(st.left);
  return`<button class="bud ${ended?'ended':''}" data-a="budDetail" data-v="${b.id}" aria-label="${esc(b.name)}預算">${flaskSvg('h'+b.id,st.f,st.over,ended)}<span class="bud-n">${esc(b.name)}</span><span class="bud-v ${cls}">${v}</span></button>`;
}

function range(p,anc){
  const a=new Date(anc.getFullYear(),anc.getMonth(),anc.getDate());
  if(p==='week'){
    const s=new Date(a);s.setDate(a.getDate()-((a.getDay()+6)%7));
    const b=[...Array(7)].map((_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);const n=new Date(d);n.setDate(d.getDate()+1);return{label:'一二三四五六日'[i],s:ymd(d),e:ymd(n)}});
    const last=new Date(s);last.setDate(s.getDate()+6);
    return{s:b[0].s,e:b[6].e,label:`${s.getMonth()+1}/${s.getDate()} – ${last.getMonth()+1}/${last.getDate()}`,b};
  }
  if(p==='month'){
    const y=a.getFullYear(),m=a.getMonth(),days=new Date(y,m+1,0).getDate(),b=[];
    for(let st=1;st<=days;st+=7){const en=Math.min(st+6,days);b.push({label:`${st}-${en}日`,s:ymd(new Date(y,m,st)),e:ymd(new Date(y,m,en+1))})}
    return{s:ymd(new Date(y,m,1)),e:ymd(new Date(y,m+1,1)),label:`${y}年${m+1}月`,b};
  }
  const y=a.getFullYear();
  return{s:`${y}-01-01`,e:`${y+1}-01-01`,label:`${y}年`,b:[...Array(12)].map((_,i)=>({label:`${i+1}月`,s:ymd(new Date(y,i,1)),e:ymd(new Date(y,i+1,1))}))};
}
function niceMax(v){const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return(f<=1?1:f<=2?2:f<=5?5:10)*e}
function barChart(b){
  const W=340,H=200,L=40,R=6,T=10,B=24,ph=H-T-B;
  const max=niceMax(Math.max(1,...b.flatMap(x=>[x.inc,x.exp])));
  const cw=(W-L-R)/b.length,bw=Math.max(4,Math.min(14,cw*.3));
  let g='';
  [0,.5,1].forEach(k=>{const y=T+ph*(1-k);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--ink3)">${short(max*k)}</text>`});
  b.forEach((x,i)=>{const cx=L+i*cw+cw/2;
    [[x.inc,'var(--inc)',cx-bw-1],[x.exp,'var(--exp)',cx+1]].forEach(([v,c,xx])=>{if(v<=0)return;const h=Math.max(2,v/max*ph);g+=`<rect x="${xx.toFixed(1)}" y="${(T+ph-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${c}"/>`});
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="${b.length>7?10:11.5}" fill="var(--ink3)">${x.label}</text>`});
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="收入與支出長條圖">${g}</svg>`;
}

function lastAcc(k){const filt=!isAll()&&ui.filter.length===1&&acc(ui.filter[0])?ui.filter[0]:null;const l=db.meta.last[k];return filt||(acc(l)?l:null)||db.accounts[0]?.id}
function kindDefaults(f){

  else if(f.kind==='deposit'&&cash&&banks.length){f.accountId=cash.id;f.toAccountId=banks[0].id}
  else{f.accountId=(banks[0]||db.accounts[0])?.id;f.toAccountId=db.accounts.find(a=>a.id!==f.accountId&&!a.cash)?.id||db.accounts.find(a=>a.id!==f.accountId)?.id}

function codeInfo(f){

      ${S==='div'?'':`<label class="fld"><span>${ISUB[S].shares}</span><input data-f="shares" value="${esc(f.shares)}" inputmode="numeric" placeholder="6" enterkeyhint="done"></label>`}</div>

    else{
      h+=`<div class="lbl">要記什麼</div><div class="seg"><button class="${f.sub==='topup'?'on':''}" data-a="fSub" data-v="topup">儲值</button><button class="${f.sub==='ride'?'on':''}" data-a="fSub" data-v="ride">搭車扣款</button></div>`;
      h+=`<div class="lbl">交通卡</div>`+chips(db.cards.map(c=>({...c,name:`${c.name}（${money(cardBalance(c))}）`})),'cardId',f,f.cardId);
      if(f.sub==='topup')h+=`<div class="lbl">用哪個帳戶的錢儲值</div>`+chips(db.accounts,'accountId',f,f.accountId);

const OPS='+−×÷';
function evalExpr(e){
  if(!e)return 0;e=e.replace(/[+−×÷.]+$/,'');
  const tk=e.match(/\d+(?:\.\d*)?|[+−×÷]/g);if(!tk)return 0;
  const st=[parseFloat(tk[0])],ops=[];
  for(let i=1;i<tk.length;i+=2){const op=tk[i],n=parseFloat(tk[i+1]);if(isNaN(n))break;
    if(op==='×')st[st.length-1]*=n;else if(op==='÷'){if(n===0)return NaN;st[st.length-1]/=n}else{ops.push(op);st.push(n)}}
  let r=st[0];ops.forEach((op,i)=>{r=op==='+'?r+st[i+1]:r-st[i+1]});return r2(r);
}
function press(f,k){
  let e=f.expr;const seg=e.split(/[+−×÷]/).pop(),last=e.slice(-1);
  if(k==='C')e='';
  else if(k==='⌫')e=e.slice(0,-1);
  else if(OPS.includes(k)){if(!e)return;e=(OPS.includes(last)||last==='.')?e.slice(0,-1)+k:e+k}
  else if(k==='.'){if(seg.includes('.'))return;e+=seg===''?'0.':'.'}
  else{if(/\.\d\d$/.test(seg)||seg.replace('.','').length>=9)return;e=seg==='0'?e.slice(0,-1)+k:e+k}
  if(e.length>32)return;f.expr=e;updateAmt(f);
}
function updateAmt(f){
  const ex=$('#expr'),rs_=$('#exprRes');if(!ex)return;
  ex.textContent=f.expr||'0';ex.classList.toggle('ph',!f.expr);
  const hasOp=/[+−×÷]/.test(f.expr.replace(/^[+−×÷]/,''));
  if(hasOp){const v=evalExpr(f.expr);rs_.textContent=isNaN(v)?'不能除以 0':'= '+money(v)}else rs_.textContent='';
}
function buildTx(f){
  const amt=evalExpr(f.expr);
  if(isNaN(amt)){toast('算式有誤，不能除以 0');return null}
  if(!(amt>0)){toast('請輸入大於 0 的金額');return null}
  const old=f.editId?db.tx.find(x=>x.id===f.editId):null;
  const t={id:old?.id||uid(),created:old?.created||Date.now(),date:f.date||today(),note:(f.note||'').trim(),amount:amt};
  if(f.type==='expense'||f.type==='income'){
    if(!acc(f.accountId)){toast('請選擇帳戶');return null}
    Object.assign(t,{type:f.type,categoryId:f.categoryId,accountId:f.accountId});
  }else if(f.type==='transfer'){
    if(!acc(f.accountId)||!acc(f.toAccountId)){toast('請選擇兩個帳戶');return null}
    if(f.accountId===f.toAccountId){toast('「從」和「到」不能是同一個帳戶');return null}
    Object.assign(t,{type:'transfer',kind:f.kind,accountId:f.accountId,toAccountId:f.toAccountId});
  }else if(f.type==='invest'){
    const code=(f.code||'').trim().toUpperCase(),n=Number(String(f.shares).replace(/[,\s]/g,''));
    if(!CODE_RE.test(code)){toast('請輸入正確的股票代號，例如 0050');return null}
    if(f.isub==='div'){if(!acc(f.accountId)){toast('請選擇帳戶');return null}Object.assign(t,{type:'div',code,accountId:f.accountId});return t}
    if(!Number.isInteger(n)||n<=0){toast('股數請輸入大於 0 的整數');return null}
    if(f.isub==='hold'){Object.assign(t,{type:'hold',code,shares:n});return t}
    if(!acc(f.accountId)){toast('請選擇帳戶');return null}
    if(f.isub==='sell'){const h=holdingsMap(f.editId)[code],have=h?h.shares:0;
      if(n>have){toast(have?`目前只有 ${have} 股，不能賣 ${n} 股`:'目前沒有持有這檔股票');return null}}
    Object.assign(t,{type:f.isub==='sell'?'sell':'buy',code,shares:n,accountId:f.accountId});
  }else{
    if(!card(f.cardId)){toast('請先新增交通卡');return null}
    if(f.sub==='topup'){if(!acc(f.accountId)){toast('請選擇儲值用的帳戶');return null}Object.assign(t,{type:'topup',cardId:f.cardId,accountId:f.accountId})}
    else Object.assign(t,{type:'ride',cardId:f.cardId});
  }
  return t;
}
function saveTx(f){
  const t=buildTx(f);if(!t)return;
  if(db.meta.confirm!==false)openSheet({ov:'center',cls:()=>'dialog',t,f,render:()=>renderConfirm(t)});
  else commitTx(t,f,1);
}
function commitTx(t,f,n){
  const old=f.editId?db.tx.find(x=>x.id===f.editId):null;
  if(old)db.tx[db.tx.indexOf(old)]=t;else db.tx.push(t);
  const m=db.meta;
  if(t.type==='expense'||t.type==='income'){m.last[t.type]=t.accountId;m.lastCat[t.type]=t.categoryId}
  if(t.type==='topup')m.last.topup=t.accountId;
  if(['buy','sell','div','hold'].includes(t.type)){if(t.accountId)m.last.invest=t.accountId;if(!db.stocks[t.code]&&db.meta.prices[t.code]?.name)db.stocks[t.code]=db.meta.prices[t.code].name}

/* ---------- 定期提醒 ---------- */
const FREQ_LABEL={week:'每週',month:'每月',year:'每年'};
const REM_TYPES={expense:'支出',income:'收入',transfer:'轉移',buy:'買股票',div:'股利'};
const REM_ICON={expense:'🧾',income:'💰',transfer:'🔁',buy:'📈',div:'🪙'};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
/* 某個日期當天或之前，最近的一次提醒日 */
function occOnOrBefore(r,d){
  d=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(r.freq==='week')return addDays(d,-((((d.getDay()+6)%7)-r.wday+7)%7));
  if(r.freq==='year'){let y=d.getFullYear(),c=new Date(y,r.month,Math.min(r.day,dim(y,r.month)));if(c>d){y--;c=new Date(y,r.month,Math.min(r.day,dim(y,r.month)))}return c}
  let y=d.getFullYear(),m=d.getMonth(),c=new Date(y,m,Math.min(r.day,dim(y,m)));
  if(c>d){m--;if(m<0){m=11;y--}c=new Date(y,m,Math.min(r.day,dim(y,m)))}return c;
}
/* 某個日期之後，下一次的提醒日 */
function occAfter(r,d){
  d=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(r.freq==='week')return addDays(occOnOrBefore(r,d),7);
  const y=d.getFullYear(),m=d.getMonth();
  if(r.freq==='year'){const c=new Date(y,r.month,Math.min(r.day,dim(y,r.month)));return c>d?c:new Date(y+1,r.month,Math.min(r.day,dim(y+1,r.month)))}
  const c=new Date(y,m,Math.min(r.day,dim(y,m)));if(c>d)return c;
  const n=new Date(y,m+1,1);return new Date(n.getFullYear(),n.getMonth(),Math.min(r.day,dim(n.getFullYear(),n.getMonth())));
}
function remPending(r){
  const t=parseD(today()),first=occAfter(r,parseD(r.doneUntil));
  if(first>t)return null;
  let n=0,d=first;while(d<=t&&n<60){n++;d=occAfter(r,d)}
  return{date:ymd(first),count:n};
}
function remNext(r){const p=remPending(r);if(p)return p.date;return ymd(occAfter(r,occOnOrBefore(r,parseD(today()))))}
function remDesc(r){
  const when=r.freq==='week'?`每週${WEEKDAYS[r.wday]}`:r.freq==='year'?`每年 ${r.month+1}/${r.day}`:`每月 ${r.day} 日`;
  let what=REM_TYPES[r.type]||'';
  if(r.type==='expense'||r.type==='income'){const c=(db.categories[r.type]||[]).find(x=>x.id===r.categoryId);if(c)what=c.name}
  if(r.type==='buy'&&r.code)what=`買 ${r.code}`;
  if(r.type==='div'&&r.code)what=`${r.code} 股利`;

  const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
}

function csvText(){
  const q=v=>{v=String(v??'');return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const tl={expense:'支出',income:'收入',topup:'交通卡儲值',ride:'交通卡扣款',buy:'買進股票',sell:'賣出股票',div:'股利',hold:'之前持有的股票'};
  const rows=[['日期','類型','分類','金額','帳戶','轉入帳戶','交通卡','備註','股票','股數']];
  [...db.tx].sort((a,b)=>a.date.localeCompare(b.date)||(a.created||0)-(b.created||0)).forEach(t=>{
    const type=t.type==='transfer'?(KIND[t.kind]||KIND.transfer).label:tl[t.type];
    const cat=['expense','income','topup','div'].includes(t.type)?catFor(t).name:'';
    const an=id=>acc(id)?.name||'';
    rows.push([t.date,type,cat,t.amount,(t.type==='ride'||t.type==='hold')?'':an(t.accountId),t.type==='transfer'?an(t.toAccountId):'',card(t.cardId)?.name||'',t.note,t.code?(t.code+' '+stockName(t.code)).trim():'',t.shares||'']);
  });
  return'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
}

  stMode:v=>{ui.stMode=v;render()},
  period:v=>{ui.period=v;render()},
  shift:v=>{const d=+v,a=ui.anchor;ui.anchor=ui.period==='week'?new Date(a.getFullYear(),a.getMonth(),a.getDate()+7*d):ui.period==='month'?new Date(a.getFullYear(),a.getMonth()+d,1):new Date(a.getFullYear()+d,0,1);render()},
  stToday:()=>{ui.anchor=new Date();render()},
  catType:v=>{ui.catType=v;render()},
  catTx:v=>{const r=range(ui.period,ui.anchor);openSheet({render:()=>{
    const list=statsTxs(r).filter(t=>{const[i,e]=flowOf(t,ui.filter);return(ui.catType==='income'?i:e)&&catFor(t).id===v}).sort(cmpTx);
    const c=list[0]?catFor(list[0]):{icon:'',name:''};
    return head(`${c.icon} ${esc(c.name)}　${r.label}`)+`<div class="sh-body">${list.length?groupedList(list,{}):'<div class="empty">沒有紀錄。</div>'}</div>`}})},
  editAcc:v=>openSheet(accSheet(v)),
  newAcc:()=>openSheet(accSheet()),
  saveAcc:()=>{
    const f=topSheet().f,name=f.name.trim(),bal=numIn(f.balance);
    if(!name)return toast('請輸入帳戶名稱');if(isNaN(bal))return toast('餘額請輸入數字');
    if(f.id){const a=acc(f.id);a.name=name;a.icon=f.icon;a.note=f.note.trim();a.initial=r2((a.initial||0)+bal-accBalance(a))}
    else db.accounts.push({id:uid(),name,icon:f.icon,note:f.note.trim(),initial:r2(bal)});
    save();closeSheet();toast(f.id?'已儲存':'已新增帳戶');
  },
  viewAccTx:v=>{setFilter([v]);ui.tab='home';window.scrollTo(0,0);closeSheet()},
  delAcc:v=>{
    if(db.accounts.length<=1)return toast('至少要保留一個帳戶');
    const a=acc(v),n=db.tx.filter(t=>t.accountId===v||t.toAccountId===v).length;
    if(!confirm(`確定要刪除「${a.name}」嗎？`+(n?`\n\n跟這個帳戶有關的 ${n} 筆紀錄也會一起刪除。`:'')))return;
    db.tx=db.tx.filter(t=>t.accountId!==v&&t.toAccountId!==v);db.accounts=db.accounts.filter(x=>x.id!==v);
    db.budgets.forEach(b=>{if(b.accounts)b.accounts=b.accounts.filter(x=>x!==v)});
    setFilter(isAll()?'all':ui.filter.filter(x=>x!==v));save();closeSheet();toast('已刪除帳戶');
  },
  newCard:()=>openSheet(cardSheet()),
  editCard:v=>openSheet(cardSheet(v)),
  saveCard:()=>{
    const f=topSheet().f,name=f.name.trim(),bal=numIn(f.balance);
    if(!name)return toast('請輸入卡片名稱');if(isNaN(bal))return toast('金額請輸入數字');
    if(f.id){const c=card(f.id);c.name=name;c.icon=f.icon;c.initial=r2((c.initial||0)+bal-cardBalance(c))}
    else db.cards.push({id:uid(),name,icon:f.icon,initial:r2(bal)});
    save();closeSheet();toast(f.id?'已儲存':'已新增交通卡');
  },
  delCard:v=>{
    const c=card(v),tops=db.tx.filter(t=>t.type==='topup'&&t.cardId===v).length;
    if(!confirm(`確定要刪除「${c.name}」嗎？\n\n扣款明細會刪除；${tops?`${tops} 筆儲值紀錄會改成一般的交通支出，帳戶餘額不會改變。`:'帳戶餘額不會改變。'}`))return;
    const tr=db.categories.expense.find(x=>x.sys==='transport')||db.categories.expense[0];
    db.tx=db.tx.filter(t=>!(t.type==='ride'&&t.cardId===v));
    db.tx.forEach(t=>{if(t.type==='topup'&&t.cardId===v){t.type='expense';t.categoryId=tr?.id;t.note=(`儲值${c.name} `+t.note).trim();delete t.cardId}});
    db.cards=db.cards.filter(x=>x.id!==v);save();closeSheet(2);toast('已刪除交通卡');
  },
  setCat:v=>{ui.setCat=v;render()},
  editCat:v=>openSheet(catSheet(ui.setCat,v)),
  newCat:()=>openSheet(catSheet(ui.setCat)),
  saveCat:()=>{
    const f=topSheet().f,name=f.name.trim(),list=db.categories[f.type];
    if(!name)return toast('請輸入分類名稱');
    if(list.some(c=>c.name===name&&c.id!==f.id))return toast('已經有同名的分類');
    if(f.id){const c=list.find(x=>x.id===f.id);c.name=name;c.icon=f.icon}
    else{const i=list.findIndex(c=>c.name==='其他');const nc={id:uid(),name,icon:f.icon};i>=0?list.splice(i,0,nc):list.push(nc)}
    save();closeSheet();toast(f.id?'已儲存':'已新增分類');
  },
  delCat:()=>{
    const f=topSheet().f,list=db.categories[f.type];
    if(list.length<=1)return toast('至少要保留一個分類');
    const c=list.find(x=>x.id===f.id),used=db.tx.filter(t=>t.type===f.type&&t.categoryId===f.id);
    const other=list.find(x=>x.name==='其他'&&x.id!==f.id);
    if(!confirm(`確定要刪除「${c.name}」分類嗎？`+(used.length?`\n\n有 ${used.length} 筆紀錄用到它，會改成「${other?'其他':'未分類'}」。`:'')))return;
    used.forEach(t=>t.categoryId=other?.id);db.categories[f.type]=list.filter(x=>x.id!==f.id);
    db.budgets.forEach(b=>{if(b.cats&&b.cats.includes(f.id)){b.cats=b.cats.filter(x=>x!==f.id);if(other&&!b.cats.includes(other.id))b.cats.push(other.id)}});
    save();closeSheet();toast('已刪除分類');
  },
  exportJson:()=>{download(`記帳本備份-${stamp()}.json`,backupText(),'application/json');markBackup();toast('已下載備份檔')},
  shareJson:async()=>{
    const file=new File([backupText()],`記帳本備份-${stamp()}.json`,{type:'application/json'});
    if(!navigator.canShare||!navigator.canShare({files:[file]}))return toast('這支手機不支援分享檔案，請改用「下載備份檔」');
    try{await navigator.share({files:[file],title:'記帳本備份'});markBackup();toast('已分享備份檔')}catch(e){}
  },
  importJson:()=>$('#importFile').click(),
  exportCsv:()=>{download(`記帳本-${stamp()}.csv`,csvText(),'text/csv');toast('已匯出表格')},
  clearAll:()=>{
    if(!confirm('確定要清除所有資料嗎？\n\n建議先下載備份檔。'))return;
    if(!confirm('再確認一次：清除後無法復原。'))return;
    db=defaults();ui.filter='all';save();render();toast('已清除所有資料');
  },
  install:async()=>{if(!installEvt)return;installEvt.prompt();await installEvt.userChoice.catch(()=>{});installEvt=null;render()},
};

$('#importFile').addEventListener('change',e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let o;try{o=JSON.parse(rd.result)}catch(err){return toast('這不是記帳本的備份檔')}
    if(!o||!Array.isArray(o.accounts)||!Array.isArray(o.tx))return toast('這不是記帳本的備份檔');
    if(!confirm(`要用這個備份還原嗎？\n\n備份裡有 ${o.tx.length} 筆紀錄，目前的資料會被取代。`))return;
    db=normalize(o);ui.filter=db.meta.filter;setFilter(ui.filter);render();toast('已還原備份');
  };
  rd.readAsText(file);
});

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el){if(e.target.classList.contains('ov'))closeSheet();return}
  const fn=A[el.dataset.a];if(fn)fn(el.dataset.v,el);
});
const onField=e=>{const k=e.target.dataset?.f,f=topSheet()?.f;if(!k||!f)return;
  if(k==='code'){const v=e.target.value.toUpperCase().replace(/[^0-9A-Z]/g,'');if(v!==e.target.value)e.target.value=v;f.code=v;if(e.type==='input'&&f.type==='invest')lookupName(f);return}
  f[k]=e.target.value};
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList?.contains('note'))e.target.blur()});

/* ---------- render ---------- */
const TITLES={home:'記帳本',stats:'統計',accounts:'帳戶',settings:'設定'};
const VIEWS={home:viewHome,stats:viewStats,accounts:viewAccounts,settings:viewSettings};
function render(){
  if(!isAll()&&ui.filter.some(id=>!acc(id)))setFilter(ui.filter);
  $('#view').innerHTML=VIEWS[ui.tab]();
  $('#title').textContent=TITLES[ui.tab];
  document.querySelectorAll('.tabbar [data-a="tab"]').forEach(b=>b.classList.toggle('on',b.dataset.v===ui.tab));
  renderSheets(false);
}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(ui.tab==='settings')render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('已安裝到桌面')});
window.addEventListener('storage',e=>{if(e.key===KEY){db=load();ui.filter=db.meta.filter;render()}});
history.replaceState({s:0},'');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
const onOpen=()=>{if(!checkReminders())checkEnded()};
setTimeout(onOpen,700);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){render();setTimeout(onOpen,400)}});
</script>
</body>
</html>
